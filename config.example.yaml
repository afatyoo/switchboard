# /etc/switchboard/config.yaml
mode: manual                 # manual | ldap
cert_dir: /etc/haproxy/certs # HAProxy "crt" directory
group: haproxy               # files are written root:<group> 0640
# extra_ca: /etc/switchboard/extra-ca.pem   # trust an extra CA (labs, private CA)
warn_days: 21
lock_file: /run/switchboard.lock

# Used when mode: ldap. Read-only: Switchboard only searches and never writes.
ldap:
  url: ldaps://ldap.provider.example:636   # ldapi:///run/carbonio/run/ldapi on the Carbonio node
  starttls: false
  bind_dn: uid=zimbra,cn=admins,cn=zimbra   # must be able to read zimbraSSLPrivateKey
  password_file: /etc/switchboard/ldap.pass      # mode 0600, or:
  # password_command: [runuser, -u, zextras, --, /opt/zextras/bin/zmlocalconfig, -s, -m, nokey, zimbra_ldap_password]
  base_dn: ""                                    # "" searches the whole tree
  # ca_file: /etc/switchboard/ldap-ca.pem
  timeout: 15s
  state_file: /var/lib/switchboard/ldap-managed.json
  max_remove: 5              # refuse to remove more certificates than this in one run

# STARTTLS proxy for 587, 143 and 110 (switchboard proxy, switchboard-proxy.service).
# Uses cert_dir like HAProxy, so add/sync cover these ports too.
proxy:
  default_cert: /etc/haproxy/default.pem
  banner: mail.provider.example
  transparent: true                      # needs CAP_NET_ADMIN and deploy/tproxy
  upstream_verify_name: mail.provider.example
  # upstream_ca: /etc/switchboard/upstream-ca.pem
  max_per_ip: 50
  listeners:
    - {protocol: smtp, listen: "0.0.0.0:10587", upstream: "HOST_IP:587"}
    - {protocol: imap, listen: "0.0.0.0:10143", upstream: "HOST_IP:143"}
    - {protocol: pop3, listen: "0.0.0.0:10110", upstream: "HOST_IP:110"}

haproxy:
  check_cmd: [haproxy, -c, -q, -f, /etc/haproxy/haproxy.cfg]
  reload_cmd: [systemctl, reload, haproxy]
  timeout: 30s
