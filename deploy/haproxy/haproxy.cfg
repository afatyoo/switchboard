# Switchboard lab: SNI gateway for IMAPS/POP3S in front of Carbonio Proxy
global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    setcap cap_net_admin,cap_net_raw
    maxconn 20000
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30m
    timeout server 30m

frontend imaps
    bind :10993 ssl crt /etc/haproxy/default.pem crt /etc/haproxy/certs/
    stick-table type ip size 100k expire 10m store conn_rate(60s),conn_cur
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_rate gt 60 } || { sc0_conn_cur gt 50 }
    default_backend carbonio_imaps

frontend pop3s
    bind :10995 ssl crt /etc/haproxy/default.pem crt /etc/haproxy/certs/
    stick-table type ip size 100k expire 10m store conn_rate(60s),conn_cur
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_rate gt 60 } || { sc0_conn_cur gt 50 }
    default_backend carbonio_pop3s

frontend smtps
    bind :10465 ssl crt /etc/haproxy/default.pem crt /etc/haproxy/certs/
    stick-table type ip size 100k expire 10m store conn_rate(60s),conn_cur
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_rate gt 30 } || { sc0_conn_cur gt 20 }
    default_backend carbonio_smtps

backend carbonio_imaps
    server proxy1 HOST_IP:993 source 0.0.0.0 usesrc clientip ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt verifyhost mail.provider.example

backend carbonio_pop3s
    server proxy1 HOST_IP:995 source 0.0.0.0 usesrc clientip ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt verifyhost mail.provider.example

backend carbonio_smtps
    server mta1 HOST_IP:465 source 0.0.0.0 usesrc clientip ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt verifyhost mail.provider.example
