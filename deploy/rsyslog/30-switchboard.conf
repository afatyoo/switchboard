# /etc/rsyslog.d/30-switchboard.conf
# Collect Switchboard and HAProxy logs in /var/log/switchboard/ and,
# optionally, forward them to a central syslog server.
#
# switchboard-proxy logs one line per session (client IP, SNI, result),
# switchboard-watchdog logs fail-open events, HAProxy logs one line per
# connection (option tcplog). journald forwards them to rsyslog.

template(name="SwitchboardFile" type="string" string="%timegenerated:::date-rfc3339% %HOSTNAME% %programname%: %msg:::drop-last-lf%\n")

if $programname == 'switchboard' then {
    action(type="omfile" file="/var/log/switchboard/switchboard.log" template="SwitchboardFile")
    # Central syslog (TCP). Uncomment and set the target:
    # action(type="omfwd" target="syslog.example.net" port="514" protocol="tcp"
    #        queue.type="LinkedList" queue.filename="sb_fwd" queue.saveOnShutdown="on"
    #        action.resumeRetryCount="-1")
    stop
}

if $programname == 'haproxy' then {
    action(type="omfile" file="/var/log/switchboard/haproxy.log" template="SwitchboardFile")
    # action(type="omfwd" target="syslog.example.net" port="514" protocol="tcp"
    #        queue.type="LinkedList" queue.filename="sb_fwd_haproxy" queue.saveOnShutdown="on"
    #        action.resumeRetryCount="-1")
    stop
}
