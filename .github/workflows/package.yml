name: package
on:
  pull_request:
  push:
    tags: ["v*"]

# Read-only by default; only the tag-triggered release job can write.
permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      codename: ${{ steps.v.outputs.codename }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            v="${REF_NAME#v}"
          else
            v="0.0.0-dev+${SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # codename from the CHANGELOG header: ## v0.2.0 "Bakelite"
          c=""
          if [ "$REF_TYPE" = "tag" ]; then
            c=$(grep -m1 -E "^## ${REF_NAME} \"" CHANGELOG.md | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "codename=$c" >> "$GITHUB_OUTPUT"

      - name: Test
        run: make vet test

      - name: Build
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CODENAME: ${{ steps.v.outputs.codename }}
        run: make linux VERSION="v$VERSION" CODENAME="$CODENAME"

      - name: Package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          mkdir -p dist/pkg
          nfpm package --config packaging/nfpm.yaml --packager deb --target dist/pkg/
          cp dist/switchboard-linux-amd64 dist/pkg/
          cd dist/pkg && sha256sum * > SHA256SUMS && ls -l

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: switchboard-${{ steps.v.outputs.version }}
          path: dist/pkg/

  release:
    needs: deb
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # CHANGELOG.md is needed for the release notes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: switchboard-${{ needs.deb.outputs.version }}
          path: dist/pkg/

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CODENAME: ${{ needs.deb.outputs.codename }}
        run: |
          notes=$(awk -v t="## ${TAG}" 'index($0, t)==1 && (length($0)==length(t) || substr($0, length(t)+1, 1)==" "){f=1;next} /^## /{f=0} f' CHANGELOG.md)
          title="Switchboard $TAG"
          if [ -n "$CODENAME" ]; then
            title="$title \"$CODENAME\""
            notes="Codename: **$CODENAME**"$'\n\n'"$notes"
          fi
          gh release create --repo "$GITHUB_REPOSITORY" "$TAG" dist/pkg/* --title "$title" --notes "$notes"
